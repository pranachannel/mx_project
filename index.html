<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectMX Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>

    <style>
        :root { --primary-color: #333; --bg-color: #f0f2f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: #31333f; }
        
        .main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .st-card { background: white; padding: 1.5rem; border-radius: 0.5rem; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px 0px; margin-bottom: 1rem; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .filters { display: flex; gap: 10px; align-items: center; }
        
        input[type="text"].date-picker-box { 
            padding: 10px 15px; border: 2px solid #ddd; border-radius: 8px; outline: none;
            cursor: pointer; font-size: 15px; font-weight: bold; text-align: center;
            background-color: white; transition: border-color 0.2s; width: 140px;
        }
        input[type="text"].date-picker-box:hover { border-color: #888; }
        input[type="text"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }

        .tab-container { display: flex; gap: 5px; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: 500; color: #555; transition: all 0.2s; }
        .tab:hover { background: #eee; }
        .tab.active { background: var(--primary-color); color: white; font-weight: bold; }
        .btn-refresh {
            margin-left: auto; background: white; color: #555; border: 1px solid #ccc;
            padding: 9px 14px; border-radius: 5px; cursor: pointer; font-size: 13px;
            font-weight: bold; transition: all 0.2s; white-space: nowrap;
        }
        .btn-refresh:hover:not(:disabled) { background: #f5f5f5; border-color: #888; color: #222; }
        .btn-refresh:disabled { cursor: wait; opacity: 0.6; }
        .btn-refresh .refresh-icon { display: inline-block; margin-right: 5px; }
        .btn-refresh.loading .refresh-icon { animation: refresh-spin 0.8s linear infinite; }
        @keyframes refresh-spin { to { transform: rotate(360deg); } }

        .content-section { display: none; }
        .content-section.active { display: block; }

        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 1.5rem; }
        .metric-item { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #eee; text-align: left; }
        .metric-label { font-size: 0.9rem; color: #666; font-weight: bold; }
        .metric-value { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: #007bff; }

        .controls-wrapper { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; min-height: 45px; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; min-width: 750px; }
        td, th { padding: 12px; border-bottom: 1px solid #eee; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        th { background: #fafafa; font-size: 0.85rem; color: #666; user-select: none; transition: background 0.2s; }
        th.sortable { cursor: pointer; }
        th.sortable:hover { background: #e2e6ea; }
        th span[id^="sort-"] { display: inline-block; text-align: center; color: #888; margin-left: 2px; }
        
        table tbody tr { cursor: pointer; transition: background 0.1s; }
        table tbody tr:hover { background-color: #f8f9fa !important; }
        
        .td-bookmark { cursor: pointer; text-align: center; transition: background 0.1s; }
        .td-bookmark:hover { background-color: #e2e6ea !important; }
        .star-checkbox { transform: scale(1.3); pointer-events: none; }
        
        .badge { padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .bg-gonic { background: #17a2b8; } .bg-ban { background: #6c757d; } .bg-udong { background: #dc3545; }

        .pagination-container { display: flex; justify-content: center; gap: 5px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { padding: 6px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; transition: 0.2s; font-size: 13px; color: #555; }
        .page-btn:hover:not(:disabled) { background: #eee; }
        .page-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); font-weight: bold; }
        .page-btn:disabled { background: #f9f9f9; color: #ccc; cursor: not-allowed; border-color: #eee; }

        .modal {
            display: none; position: fixed; z-index: 1000; inset: 0;
            background: rgba(0,0,0,0.5); overflow-y: auto; padding: 24px 0; box-sizing: border-box;
        }
        .modal-content {
            background: white; margin: 0 auto; padding: 0 25px 25px; border-radius: 10px; width: 90%; max-width: 900px;
            max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box; position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .modal-header {
            position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 12px;
            min-height: 58px; background: white; border-bottom: 1px solid #eee; padding: 0 48px 0 0;
        }
        .modal-header h3 { margin: 0; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
        .modal-close {
            position: absolute; right: 0; top: 7px; width: 44px; height: 44px; border: 0; border-radius: 8px;
            background: transparent; color: #555; cursor: pointer; font-size: 30px; line-height: 1;
        }
        .modal-close:hover { background: #f1f3f5; color: #111; }
        .modal-section { scroll-margin-top: 112px; }
        .modal-section-nav {
            display: none; position: sticky; top: 58px; z-index: 7; gap: 6px; padding: 8px 0;
            background: white; border-bottom: 1px solid #eee;
        }
        .modal-section-nav button {
            min-height: 40px; border: 1px solid #ddd; background: #fff; border-radius: 7px;
            font-size: 13px; font-weight: 700; color: #555; cursor: pointer;
        }
        .modal-section-nav button:active { background: #eee; }
        #chart-container { width: 100%; height: 350px; margin-top: 12px; }

        .activity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
        .activity-panel { border: 1px solid #e5e7eb; border-radius: 9px; background: #fafafa; overflow: hidden; min-width: 0; }
        .activity-panel-header {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 14px; border-bottom: 1px solid #e5e7eb; background: white;
        }
        .activity-panel-header h4 { margin: 0; font-size: 15px; }
        .activity-limit { font-size: 11px; color: #888; white-space: nowrap; }
        .activity-list {
            max-height: 390px; overflow-y: auto; padding: 8px; box-sizing: border-box;
            -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        }
        .activity-item { background: white; border: 1px solid #e9ecef; border-radius: 8px; padding: 11px 12px; margin-bottom: 8px; }
        .activity-item:last-child { margin-bottom: 0; }
        .activity-item-title {
            font-size: 14px; font-weight: 700; color: #30323a; margin-bottom: 5px; line-height: 1.4;
            overflow-wrap: anywhere; word-break: break-word;
        }
        .activity-item-meta {
            font-size: 11px; color: #888; margin-bottom: 7px; display: flex; gap: 6px;
            align-items: center; flex-wrap: wrap; line-height: 1.5;
        }
        .activity-type-badge {
            display: inline-flex; align-items: center; min-height: 20px; padding: 1px 6px;
            border: 1px solid #ddd; border-radius: 999px; background: #f7f7f7; color: #666;
            font-size: 10px; font-weight: 700;
        }
        .activity-item-content {
            font-size: 13px; color: #444; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
            word-break: break-word; background: #f8f9fa; border-radius: 6px; padding: 9px; min-height: 20px;
        }
        .activity-item-content.empty { color: #999; font-style: italic; }
        .activity-item-content.post-collapsible.collapsed {
            max-height: calc((1.6em * 5) + 18px);
            overflow: hidden;
        }
        .activity-content-toggle {
            display: block; margin: 4px 0 2px; padding: 2px 0; border: 0; background: transparent;
            color: #0069d9; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;
            text-underline-offset: 2px;
        }
        .activity-content-toggle[hidden] { display: none; }
        .activity-content-toggle:hover { color: #004f9f; }
        .activity-inline-link {
            display: inline-flex; align-items: center; margin: 0 2px; color: #0069d9; text-decoration: underline;
            text-underline-offset: 2px; overflow-wrap: anywhere;
        }
        .activity-media-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .activity-media-links .activity-item-link { margin-top: 0; }
        .activity-item-link {
            display: inline-flex; align-items: center; min-height: 32px; padding: 0 2px; margin-top: 7px;
            font-size: 12px; color: #0069d9; text-decoration: none; overflow-wrap: anywhere;
        }
        .activity-item-link:hover { text-decoration: underline; }
        .activity-state { padding: 28px 12px; text-align: center; color: #888; font-size: 13px; line-height: 1.5; }
        .activity-state.error { color: #c0392b; }
        body.modal-open { overflow: hidden; }

        @media (max-width: 720px) {
            .main { padding: 0.8rem; }
            /* PC와 동일하게 제목-날짜 선택기를 같은 행에 유지합니다. */
            .header { align-items: center; gap: 10px; margin-bottom: 1.2rem; flex-direction: row; }
            .header h1 { flex: 1 1 auto; min-width: 0; font-size: 1.18rem !important; line-height: 1.3; }
            .filters { flex: 0 0 auto; width: auto; }
            input[type="text"].date-picker-box {
                width: 126px; box-sizing: border-box; min-height: 40px; font-size: 14px;
                padding: 8px 10px; border-width: 2px;
            }

            .tab-container {
                gap: 4px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch;
                scrollbar-width: thin; padding-bottom: 8px;
            }
            .tab {
                flex: 0 0 auto; height: 40px; min-height: 0; padding: 0 10px; box-sizing: border-box;
                display: inline-flex; align-items: center; justify-content: center;
                font-size: 13px; line-height: 1;
            }
            /* 모바일에서도 PC처럼 아이콘 + '새로고침' 문구를 함께 표시합니다. */
            .btn-refresh { flex: 0 0 auto; margin-left: auto; min-height: 40px; padding: 8px 11px; font-size: 12px; }
            .btn-refresh .refresh-icon { margin-right: 4px; font-size: 15px; }
            .btn-refresh .refresh-text { display: inline; }

            /* 세 요약 지표를 PC와 동일하게 한 행의 3개 카드로 유지합니다. */
            .metrics-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
            .metric-item { padding: 0.8rem 0.65rem; min-width: 0; }
            .metric-label { font-size: 0.72rem; white-space: nowrap; }
            .metric-value { font-size: 1.35rem; margin-top: 4px; overflow-wrap: anywhere; }
            .st-card { padding: 1rem; }
            .controls-wrapper { align-items: stretch; }
            .controls-wrapper input[type="text"] { min-height: 44px; font-size: 16px; }
            .btn-search, .btn-star-filter, .btn-rank, .btn-type { min-height: 42px; }

            .table-responsive { overscroll-behavior-x: contain; }
            table { min-width: 700px; }
            td, th { padding: 11px 9px; }
            table tbody tr { touch-action: manipulation; }

            .modal { padding: 0; overflow: hidden; }
            .modal-content {
                width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border-radius: 0;
                padding: 0 14px 24px; overflow-y: auto; overscroll-behavior-y: contain;
            }
            .modal-header { min-height: 56px; padding-right: 46px; }
            .modal-header h3 { font-size: 16px; }
            .modal-close { right: 0; top: 6px; }
            .modal-section-nav { display: grid; grid-template-columns: repeat(3, 1fr); top: 56px; }
            .modal-section { scroll-margin-top: 108px; }
            #chart-container { height: 285px; margin-top: 8px; }

            .activity-grid { grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
            .activity-panel { overflow: visible; }
            .activity-list { max-height: none; overflow: visible; padding: 8px 0; }
            .activity-panel-header { position: sticky; top: 104px; z-index: 5; border: 1px solid #e5e7eb; border-radius: 8px; }
            .activity-item { padding: 12px; margin-bottom: 10px; }
            .activity-item-title { font-size: 15px; }
            .activity-item-content { font-size: 14px; line-height: 1.65; padding: 10px; }
            .activity-item-link { min-height: 44px; font-size: 13px; }
        }

        .btn-search { background: var(--primary-color); color: white; border: 1px solid var(--primary-color); padding: 10px 40px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-search:hover { background: #000; }
        
        .btn-star-filter { background: white; border: 1px solid #ddd; padding: 9px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-star-filter:hover { border-color: #aaa; background: #fafafa; }
        .btn-star-filter.active { background: #fffacd; border-color: #ffda44; font-weight: bold; }

        .btn-rank { background: white; border: 1px solid #ddd; padding: 7px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; color: #666; transition: all 0.2s; }
        .btn-rank:hover { background: #eee; }
        .btn-rank.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .btn-type { background: white; border: 1px solid #ddd; padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; color: #888; transition: all 0.2s; }
        .btn-type.active.gonic { background: #17a2b8; color: white; border-color: #17a2b8; }
        .btn-type.active.ban { background: #6c757d; color: white; border-color: #6c757d; }
        .btn-type.active.udong { background: #dc3545; color: white; border-color: #dc3545; }

        .status-msg { font-size: 0.85rem; margin-bottom: 1rem; font-weight: bold; }
        .rank-number { font-weight: bold; color: #666; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="main">
    <div class="header">
        <h1 style="margin:0; font-size: 1.8rem;">블루아카이브 갤러리 대시보드</h1>
        <div class="filters">
            <input type="text" id="date-picker" class="date-picker-box" placeholder="날짜 선택"> 
        </div>
    </div>

    <div class="tab-container">
        <div class="tab active" onclick="switchTab('trends', this)">상세 그래프</div>
        <div class="tab" onclick="switchTab('ranking', this)">유저 랭킹</div>
        <div class="tab" onclick="switchTab('search', this)">유저 검색</div>
        <button id="refresh-btn" class="btn-refresh" type="button" onclick="refreshCurrentData()" title="현재 선택 날짜의 최신 데이터를 다시 불러옵니다">
            <span class="refresh-icon">↻</span><span class="refresh-text">새로고침</span>
        </button>
    </div>

    <div id="status-text" class="status-msg">데이터 로딩 중...</div>

    <div id="section-trends" class="content-section active">
        <div class="metrics-grid">
            <div class="metric-item"><div class="metric-label">총 게시글</div><div id="m-posts" class="metric-value">0</div></div>
            <div class="metric-item"><div class="metric-label">총 댓글</div><div id="m-comments" class="metric-value">0</div></div>
            <div class="metric-item"><div class="metric-label">활동 유저 수</div><div id="m-users" class="metric-value">0</div></div>
        </div>
        <div class="st-card">
            <h3 style="margin-top:0;">시간대 활동 그래프</h3>
            <div id="main-trend-chart" style="width: 100%; height: 400px;"></div>
        </div>
    </div>

    <div id="section-ranking" class="content-section">
        <div class="st-card">
            <div class="controls-wrapper" style="justify-content: space-between;">
                <button id="ranking-star-filter" class="btn-star-filter" onclick="toggleStarFilter('ranking')" title="즐겨찾기 유저만 보기">⭐</button>
                <div style="display:flex; gap: 5px; margin-left: auto;">
                    <button id="btn-rank-post" class="btn-rank" onclick="setRankingMode('post')">게시글</button>
                    <button id="btn-rank-comment" class="btn-rank" onclick="setRankingMode('comment')">댓글</button>
                    <button id="btn-rank-total" class="btn-rank active" onclick="setRankingMode('total')">총합</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table>
                    <colgroup>
                        <col style="width: 60px;">
                        <col style="width: 60px;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 10%;">
                        <col style="width: 10%;">
                        <col style="width: 10%;">
                        <col style="width: 10%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th style="text-align: center;">순위</th>
                            <th style="text-align: center;">⭐</th>
                            <th>닉네임</th>
                            <th>UID(IP)</th>
                            <th>타입</th>
                            <th>글</th>
                            <th>댓글</th>
                            <th>총합</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="section-search" class="content-section">
        <div class="st-card">
            <div class="controls-wrapper">
                <button id="search-star-filter" class="btn-star-filter" onclick="toggleStarFilter('search')" title="즐겨찾기 유저만 보기">⭐</button>
                
                <input type="text" id="search-input" placeholder="검색할 닉네임 또는 UID(IP) 입력" style="flex: 1; box-sizing: border-box; margin:0; min-width: 200px;" onkeypress="if(event.key === 'Enter') executeSearch()">
                
                <div style="display:flex; gap:5px;">
                    <button id="btn-type-gonic" class="btn-type gonic active" onclick="toggleSearchType('고닉')">고닉</button>
                    <button id="btn-type-ban" class="btn-type ban active" onclick="toggleSearchType('반고닉')">반고닉</button>
                    <button id="btn-type-udong" class="btn-type udong active" onclick="toggleSearchType('유동')">유동</button>
                </div>
                <button class="btn-search" onclick="executeSearch()">검색</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <colgroup>
                        <col style="width: 60px;">
                        <col style="width: 22%;">
                        <col style="width: 22%;">
                        <col style="width: 12%;">
                        <col style="width: 11%;">
                        <col style="width: 11%;">
                        <col style="width: 12%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="sortable" style="text-align: center;" onclick="handleHeaderSort('search', 'bookmark')">⭐<span id="sort-search-bookmark"></span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'nickname')">닉네임<span id="sort-search-nickname"></span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'id')">UID(IP)<span id="sort-search-id"></span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'type')">타입<span id="sort-search-type">▲</span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'post')">글<span id="sort-search-post"></span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'comment')">댓글<span id="sort-search-comment"></span></th>
                            <th class="sortable" onclick="handleHeaderSort('search', 'total')">총합<span id="sort-search-total"></span></th>
                        </tr>
                    </thead>
                    <tbody id="search-body"></tbody>
                </table>
            </div>
            <div id="search-pagination" class="pagination-container"></div>
        </div>
    </div>
</div>

<div id="graph-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">유저 활동 분석</h3>
            <button class="modal-close" type="button" onclick="closeModal()" aria-label="상세창 닫기">&times;</button>
        </div>

        <nav class="modal-section-nav" aria-label="상세 정보 바로가기">
            <button type="button" onclick="scrollModalSection('modal-chart-section')">그래프</button>
            <button type="button" onclick="scrollModalSection('modal-posts-section')">게시글</button>
            <button type="button" onclick="scrollModalSection('modal-comments-section')">댓글</button>
        </nav>

        <section id="modal-chart-section" class="modal-section">
            <div id="chart-container"></div>
        </section>

        <div class="activity-grid">
            <section id="modal-posts-section" class="activity-panel modal-section">
                <div class="activity-panel-header">
                    <h4>최근 게시글</h4>
                    <span class="activity-limit">최대 5개</span>
                </div>
                <div id="recent-posts" class="activity-list">
                    <div class="activity-state">불러오는 중...</div>
                </div>
            </section>

            <section id="modal-comments-section" class="activity-panel modal-section">
                <div class="activity-panel-header">
                    <h4>최근 댓글</h4>
                    <span class="activity-limit">최대 10개</span>
                </div>
                <div id="recent-comments" class="activity-list">
                    <div class="activity-state">불러오는 중...</div>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
    const R2_DOMAIN = "https://pub-fca2435a027e41bf954b4bc4f46e560a.r2.dev"; 
    const GALLERY_ID = "projectmx";
    // Cloudflare Worker를 배포한 뒤 주소를 넣으면 dcimg 계열 핫링크/Referer 차단을
    // 우회해 이미지·움짤·동영상을 뷰어 안에서 표시할 수 있습니다. 비어 있으면 원본 URL을 직접 사용합니다.
    const MEDIA_RELAY_URL = "";
    const HY_PARQUET_URL = "https://cdn.jsdelivr.net/npm/hyparquet@1.28.1/+esm";
    const HY_PARQUET_COMPRESSORS_URL = "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm";

    const PROJECT_START_DATE = "2026-06-07"; 

    let currentData = [];
    let bookmarks = JSON.parse(localStorage.getItem('user_bookmarks')) || [];
    let activeTab = 'trends';
    
    let dailyTrendData = null;
    let hourlyRawData = [];

    // 상세 본문 Parquet는 상세창을 열었을 때만 읽습니다.
    // 같은 파일을 다시 요청하지 않도록 브라우저 메모리에 Promise 자체를 캐시합니다.
    const parquetCache = new Map();
    let parquetModulePromise = null;
    let modalLoadSequence = 0;

    let currentRankingMode = 'total'; 

    let sortStates = {
        search: { key: 'type', order: 'asc' }
    };

    let filterOnlyBookmarks = { ranking: false, search: false };
    let searchTypes = { '고닉': true, '반고닉': true, '유동': true };

    let searchCurrentPage = 1;
    const searchItemsPerPage = 15;
    let searchFilteredData = [];

    const todayKst = new Date(new Date().getTime() + (9 * 60 * 60 * 1000)).toISOString().split('T')[0];

    flatpickr("#date-picker", {
        locale: "ko",
        defaultDate: todayKst,
        minDate: PROJECT_START_DATE,
        maxDate: "today",
        disableMobile: true,
        onChange: function(selectedDates, dateStr, instance) {
            fetchDailyData(dateStr);
        }
    });

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(match) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match];
        });
    }

    function formatUserIdentity(user) {
        if (!user) return '';

        const type = cleanText(user.type);
        const uid = cleanText(user.uid);
        const ip = cleanText(user.ip);
        const userKey = cleanText(user.user_key);
        const legacyId = cleanText(user.id || user.display_id);

        // 현재 main.go의 집계 JSON은 고닉/반고닉은 uid, 유동은 ip를 별도 필드로 저장합니다.
        if (type === '유동') {
            if (ip) return ip;
            if (/^ip:/i.test(userKey)) return userKey.replace(/^ip:/i, '');
            if (/^ip:/i.test(legacyId)) return legacyId.replace(/^ip:/i, '');
            return legacyId;
        }

        if (type === '고닉' || type === '반고닉') {
            if (uid) return uid;
            if (/^id:/i.test(userKey)) return userKey.replace(/^id:/i, '');

            // 구버전 display_id가 id:닉네임(UID) 형태라면 괄호 안 UID만 복원합니다.
            const match = legacyId.match(/^id:.*\(([^()]*)\)$/i);
            if (match && cleanText(match[1])) return cleanText(match[1]);
            if (/^id:/i.test(legacyId)) return legacyId.replace(/^id:/i, '');
            return legacyId;
        }

        // 타입이 없는 구버전 데이터에 대한 보수적 fallback입니다.
        if (uid) return uid;
        if (ip) return ip;
        if (/^id:/i.test(userKey)) return userKey.replace(/^id:/i, '');
        if (/^ip:/i.test(userKey)) return userKey.replace(/^ip:/i, '');
        return legacyId.replace(/^(?:id|ip):/i, '');
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        
        el.classList.add('active');
        document.getElementById(`section-${tabId}`).classList.add('active');
        activeTab = tabId;
        
        if (tabId === 'trends' && dailyTrendData) renderTrendChart();
    }

    function withRefreshToken(url, token) {
        if (!token) return url;
        return `${url}${url.includes('?') ? '&' : '?'}refresh=${encodeURIComponent(token)}`;
    }

    function aggregateJsonCandidates(dateStr, hour) {
        const hh = String(hour).padStart(2, '0');
        return [
            // main.go v4 현재 구조: 2026-08-25/13h/13h.json
            `${R2_DOMAIN}/${dateStr}/${hh}h/${hh}h.json`,
            // 이전 대시보드 데이터 호환: 2026-08-25/13h.json
            `${R2_DOMAIN}/${dateStr}/${hh}h.json`
        ];
    }

    async function fetchJsonFromCandidates(candidates, refreshToken = '') {
        let lastError = null;
        for (const baseUrl of candidates) {
            const url = withRefreshToken(baseUrl, refreshToken);
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.status === 404) continue;
                if (!response.ok) {
                    lastError = new Error(`JSON 요청 실패 (${response.status})`);
                    continue;
                }
                return await response.json();
            } catch (error) {
                lastError = error;
            }
        }
        if (lastError) console.warn('시간대 JSON을 불러오지 못했습니다:', lastError);
        return null;
    }

    async function fetchDailyData(dateStr, forceRefresh = false) {
        const statusText = document.getElementById('status-text');

        // 새로고침 시 이전 상세 Parquet 캐시(404 포함)를 비워 새로 생성된 파일도 다시 확인합니다.
        if (forceRefresh) parquetCache.clear();
        statusText.innerText = forceRefresh
            ? `${dateStr}의 최신 데이터를 다시 불러오는 중입니다`
            : `${dateStr}의 데이터를 합산 중입니다`;
        statusText.style.color = "#555";

        const refreshToken = forceRefresh ? String(Date.now()) : '';
        const promises = Array.from({length: 24}, (_, i) =>
            fetchJsonFromCandidates(aggregateJsonCandidates(dateStr, i), refreshToken)
        );

        const results = await Promise.all(promises);
        hourlyRawData = results;

        let lastValidIndex = -1;
        for(let i = 23; i >= 0; i--) {
            if(results[i] !== null) {
                lastValidIndex = i;
                break;
            }
        }

        const trendPosts = [];
        const trendComments = [];
        const trendUsers = [];
        const xAxisLabels = [];
        const userMap = new Map();

        for (let i = 0; i <= lastValidIndex; i++) {
            const data = results[i];
            xAxisLabels.push(`${i}시`);

            if (data && data.length > 0) {
                let hourPosts = 0;
                let hourComments = 0;

                data.forEach(u => {
                    hourPosts += Number(u.post || 0);
                    hourComments += Number(u.comment || 0);

                    const aggregateKey = u.user_key || u.id || u.display_id;
                    if (!aggregateKey) return;

                    if (userMap.has(aggregateKey)) {
                        const existing = userMap.get(aggregateKey);
                        existing.post += Number(u.post || 0);
                        existing.comment += Number(u.comment || 0);
                        existing.total += Number(u.total ?? (Number(u.post || 0) + Number(u.comment || 0)));

                        // 같은 user_key에서 닉네임/표시 ID가 바뀌었다면 더 최근 시간대의 값을 표시합니다.
                        if (u.nickname) existing.nickname = u.nickname;
                        if (u.id) existing.id = u.id;
                        if (u.display_id) existing.display_id = u.display_id;
                        if (u.uid) existing.uid = u.uid;
                        if (u.ip) existing.ip = u.ip;
                        if (u.type) existing.type = u.type;
                        if (u.user_key) existing.user_key = u.user_key;
                    } else {
                        userMap.set(aggregateKey, {
                            ...u,
                            post: Number(u.post || 0),
                            comment: Number(u.comment || 0),
                            total: Number(u.total ?? (Number(u.post || 0) + Number(u.comment || 0)))
                        });
                    }
                });

                trendPosts.push(hourPosts);
                trendComments.push(hourComments);
                trendUsers.push(data.length);
            } else {
                trendPosts.push(0);
                trendComments.push(0);
                trendUsers.push(0);
            }
        }

        dailyTrendData = { labels: xAxisLabels, posts: trendPosts, comments: trendComments, users: trendUsers };
        currentData = Array.from(userMap.values());

        if (currentData.length === 0) {
            statusText.innerText = `아직 수집된 데이터가 전혀 없습니다`;
            statusText.style.color = "red";
            updateMetrics(true);
            renderRankingTable([]);

            searchFilteredData = [];
            renderSearchTablePage(); 

            if (activeTab === 'trends') renderTrendChart();
            return;
        }

        updateMetrics(false);
        sortAndRenderRanking();
        executeSearch(); 
        if (activeTab === 'trends') renderTrendChart();

        statusText.innerText = `실시간 데이터 반영엔 시간이 걸립니다`;
        statusText.style.color = "#555";
    }

    async function refreshCurrentData() {
        const refreshBtn = document.getElementById('refresh-btn');
        const dateInput = document.getElementById('date-picker');
        const selectedDate = dateInput.value || todayKst;

        if (refreshBtn.disabled) return;

        refreshBtn.disabled = true;
        refreshBtn.classList.add('loading');

        try {
            await fetchDailyData(selectedDate, true);
        } finally {
            refreshBtn.disabled = false;
            refreshBtn.classList.remove('loading');
        }
    }

    function renderTrendChart() {
        if (!dailyTrendData || dailyTrendData.labels.length === 0) return;
        const chartDom = document.getElementById('main-trend-chart');
        const myChart = echarts.init(chartDom);
        
        const option = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['활동 유저 수', '총 게시글', '총 댓글'], top: '0%' },
            grid: { left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: dailyTrendData.labels },
            yAxis: { type: 'value' },
            series: [
                { name: '활동 유저 수', type: 'line', smooth: true, data: dailyTrendData.users, itemStyle: { color: '#28a745' }, areaStyle: { opacity: 0.1 } },
                { name: '총 게시글', type: 'line', smooth: true, data: dailyTrendData.posts, itemStyle: { color: '#007bff' }, areaStyle: { opacity: 0.1 } },
                { name: '총 댓글', type: 'line', smooth: true, data: dailyTrendData.comments, itemStyle: { color: '#ff4b4b' }, areaStyle: { opacity: 0.1 } }
            ]
        };
        myChart.setOption(option);
    }

    function updateMetrics(isEmpty) {
        if (isEmpty) {
            document.getElementById('m-posts').innerText = '0';
            document.getElementById('m-comments').innerText = '0';
            document.getElementById('m-users').innerText = '0';
            return;
        }
        const posts = currentData.reduce((sum, r) => sum + r.post, 0);
        const comments = currentData.reduce((sum, r) => sum + r.comment, 0);
        document.getElementById('m-posts').innerText = posts.toLocaleString();
        document.getElementById('m-comments').innerText = comments.toLocaleString();
        document.getElementById('m-users').innerText = currentData.length.toLocaleString();
    }

    function setRankingMode(mode) {
        currentRankingMode = mode;
        document.querySelectorAll('.btn-rank').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-rank-${mode}`).classList.add('active');
        sortAndRenderRanking();
    }

    function toggleStarFilter(tab) {
        filterOnlyBookmarks[tab] = !filterOnlyBookmarks[tab];
        const btn = document.getElementById(`${tab}-star-filter`);
        
        if (filterOnlyBookmarks[tab]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
        
        if (tab === 'ranking') sortAndRenderRanking();
        if (tab === 'search') executeSearch();
    }

    function toggleSearchType(type) {
        searchTypes[type] = !searchTypes[type]; 
        let btnId = type === '고닉' ? 'btn-type-gonic' : (type === '반고닉' ? 'btn-type-ban' : 'btn-type-udong');
        const btn = document.getElementById(btnId);
        
        if (searchTypes[type]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    function handleHeaderSort(tab, key) {
        if (tab !== 'search') return; 
        if (sortStates.search.key === key) {
            sortStates.search.order = sortStates.search.order === 'desc' ? 'asc' : 'desc';
        } else {
            sortStates.search.key = key;
            sortStates.search.order = 'desc';
        }
        updateSortIndicators('search');
        executeSearch();
    }

    function updateSortIndicators(tab) {
        if (tab !== 'search') return;
        const columns = ['bookmark', 'nickname', 'id', 'type', 'post', 'comment', 'total'];
        columns.forEach(col => {
            const span = document.getElementById(`sort-search-${col}`);
            if (span) {
                if (sortStates.search.key === col) {
                    span.innerText = sortStates.search.order === 'desc' ? '▼' : '▲';
                } else {
                    span.innerText = '';
                }
            }
        });
    }

    function sortData(data, key, order) {
        return data.sort((a, b) => {
            let valA, valB;
            if (key === 'bookmark') {
                valA = isUserBookmarked(a) ? 1 : 0;
                valB = isUserBookmarked(b) ? 1 : 0;
            } else if (key === 'id') {
                valA = formatUserIdentity(a);
                valB = formatUserIdentity(b);
            } else {
                valA = a[key];
                valB = b[key];
            }

            if (typeof valA === 'string') {
                return order === 'asc' ? valA.localeCompare(valB, 'ko') : valB.localeCompare(valA, 'ko');
            } else {
                return order === 'asc' ? valA - valB : valB - valA;
            }
        });
    }

    function sortAndRenderRanking() {
        let displayData = [...currentData];
        displayData.sort((a, b) => b[currentRankingMode] - a[currentRankingMode]);
        displayData.forEach((u, index) => { u.rank = index + 1; });
        
        if (filterOnlyBookmarks.ranking) {
            displayData = displayData.filter(isUserBookmarked);
        }
        displayData = displayData.slice(0, 50);

        const bookmarkedUsers = displayData.filter(isUserBookmarked);
        const normalUsers = displayData.filter(r => !isUserBookmarked(r));
        renderRankingTable([...bookmarkedUsers, ...normalUsers]);
    }

    function executeSearch() {
        const kw = document.getElementById('search-input').value.toLowerCase();
        let filtered = [...currentData];
        
        if (kw) {
            filtered = filtered.filter(r => {
                const nickname = cleanText(r.nickname).toLowerCase();
                const identity = formatUserIdentity(r).toLowerCase();
                return nickname.includes(kw) || identity.includes(kw);
            });
        }
        filtered = filtered.filter(r => searchTypes[r.type]);
        if (filterOnlyBookmarks.search) {
            filtered = filtered.filter(isUserBookmarked);
        }
        
        filtered = sortData(filtered, sortStates.search.key, sortStates.search.order);

        const bookmarkedUsers = filtered.filter(isUserBookmarked);
        const normalUsers = filtered.filter(r => !isUserBookmarked(r));
        
        searchFilteredData = [...bookmarkedUsers, ...normalUsers];
        searchCurrentPage = 1; 
        
        renderSearchTablePage();
    }

    function renderSearchTablePage() {
        const totalPages = Math.ceil(searchFilteredData.length / searchItemsPerPage) || 1;
        
        if (searchCurrentPage > totalPages) searchCurrentPage = totalPages;
        if (searchCurrentPage < 1) searchCurrentPage = 1;

        const startIdx = (searchCurrentPage - 1) * searchItemsPerPage;
        const endIdx = startIdx + searchItemsPerPage;
        const pageData = searchFilteredData.slice(startIdx, endIdx);

        renderSearchTable(pageData);
        renderSearchPagination(totalPages);
    }

    function renderSearchPagination(totalPages) {
        const container = document.getElementById('search-pagination');
        container.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '이전';
        prevBtn.disabled = searchCurrentPage === 1;
        prevBtn.onclick = () => { if (searchCurrentPage > 1) { searchCurrentPage--; renderSearchTablePage(); } };
        container.appendChild(prevBtn);

        let startPage = Math.max(1, searchCurrentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        if (startPage > 1) {
            const firstBtn = document.createElement('button');
            firstBtn.className = 'page-btn';
            firstBtn.innerText = '1';
            firstBtn.onclick = () => { searchCurrentPage = 1; renderSearchTablePage(); };
            container.appendChild(firstBtn);
            if (startPage > 2) {
                const elp = document.createElement('span');
                elp.innerText = '...';
                elp.style.padding = '5px 0';
                elp.style.color = '#888';
                container.appendChild(elp);
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === searchCurrentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { searchCurrentPage = i; renderSearchTablePage(); };
            container.appendChild(btn);
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                const elp = document.createElement('span');
                elp.innerText = '...';
                elp.style.padding = '5px 0';
                elp.style.color = '#888';
                container.appendChild(elp);
            }
            const lastBtn = document.createElement('button');
            lastBtn.className = 'page-btn';
            lastBtn.innerText = totalPages;
            lastBtn.onclick = () => { searchCurrentPage = totalPages; renderSearchTablePage(); };
            container.appendChild(lastBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = '다음';
        nextBtn.disabled = searchCurrentPage === totalPages;
        nextBtn.onclick = () => { if (searchCurrentPage < totalPages) { searchCurrentPage++; renderSearchTablePage(); } };
        container.appendChild(nextBtn);
    }

    function renderRankingTable(data) {
        const tbody = document.getElementById('ranking-body');
        tbody.innerHTML = '';
        data.forEach(row => {
            const isBookmarked = isUserBookmarked(row);
            const tr = document.createElement('tr');
            if (isBookmarked) tr.style.background = "#fffacd"; 
            
            tr.onclick = () => openModal(row);
            let bType = (row.type === "고닉") ? "bg-gonic" : (row.type === "반고닉" ? "bg-ban" : "bg-udong");
            
            const postWeight = currentRankingMode === 'post' ? 'font-weight:bold;' : '';
            const commentWeight = currentRankingMode === 'comment' ? 'font-weight:bold;' : '';
            const totalWeight = currentRankingMode === 'total' ? 'font-weight:bold;' : '';

            const safeNick = escapeHTML(row.nickname);
            const safeId = escapeHTML(formatUserIdentity(row));

            tr.innerHTML = `
                <td class="rank-number">${row.rank}위</td>
                <td class="td-bookmark" title="클릭하여 즐겨찾기">
                    <input type="checkbox" class="star-checkbox" ${isBookmarked ? 'checked' : ''}>
                </td>
                <td title="${safeNick}">${safeNick}</td>
                <td title="${safeId}">${safeId}</td>
                <td><span class="badge ${bType}">${row.type}</span></td>
                <td style="${postWeight}">${row.post}</td>
                <td style="${commentWeight}">${row.comment}</td>
                <td style="${totalWeight}">${row.total}</td>
            `;
            const bookmarkCell = tr.querySelector('.td-bookmark');
            if (bookmarkCell) {
                bookmarkCell.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleBookmarkUser(row);
                });
            }
            tbody.appendChild(tr);
        });
    }

    function renderSearchTable(data) {
        const tbody = document.getElementById('search-body');
        tbody.innerHTML = '';
        data.forEach(row => {
            const isBookmarked = isUserBookmarked(row);
            const tr = document.createElement('tr');
            if (isBookmarked) tr.style.background = "#fffacd"; 
            
            tr.onclick = () => openModal(row);
            let bType = (row.type === "고닉") ? "bg-gonic" : (row.type === "반고닉" ? "bg-ban" : "bg-udong");
            
            const safeNick = escapeHTML(row.nickname);
            const safeId = escapeHTML(formatUserIdentity(row));

            tr.innerHTML = `
                <td class="td-bookmark" title="클릭하여 즐겨찾기">
                    <input type="checkbox" class="star-checkbox" ${isBookmarked ? 'checked' : ''}>
                </td>
                <td title="${safeNick}">${safeNick}</td>
                <td title="${safeId}">${safeId}</td>
                <td><span class="badge ${bType}">${row.type}</span></td>
                <td>${row.post}</td>
                <td>${row.comment}</td>
                <td>${row.total}</td>
            `;
            const bookmarkCell = tr.querySelector('.td-bookmark');
            if (bookmarkCell) {
                bookmarkCell.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleBookmarkUser(row);
                });
            }
            tbody.appendChild(tr);
        });
    }

    let modalChart = null;

    function resolveUserKey(user) {
        if (!user) return '';
        if (user.user_key) return String(user.user_key);
        if (user.uid) return `id:${user.uid}`;
        if (user.ip) return `ip:${user.ip}`;
        if (user.type === '유동' && user.id) return String(user.id).startsWith('ip:') ? String(user.id) : `ip:${user.id}`;

        const id = String(user.id || '');
        if (id.startsWith('id:') || id.startsWith('ip:')) {
            // 표시 ID가 id:닉네임(uid) 형태인 경우 완전히 복원할 수 없으므로
            // 새 main.go가 저장하는 user_key가 없는 옛 JSON에서는 상세 Parquet 연결을 보장하지 않습니다.
            return id.includes('(') ? '' : id;
        }
        return '';
    }

    function bookmarkKey(user) {
        if (!user) return '';
        return cleanText(resolveUserKey(user) || user.id || user.display_id);
    }

    function bookmarkAliases(user) {
        const keys = new Set();
        const primary = bookmarkKey(user);
        const id = cleanText(user && (user.id || user.display_id));
        if (primary) keys.add(primary);
        if (id) keys.add(id);
        return Array.from(keys);
    }

    function isUserBookmarked(user) {
        return bookmarkAliases(user).some(key => bookmarks.includes(key));
    }

    function toggleBookmarkUser(user) {
        const aliases = bookmarkAliases(user);
        if (!aliases.length) return;

        const alreadyBookmarked = aliases.some(key => bookmarks.includes(key));
        if (alreadyBookmarked) {
            bookmarks = bookmarks.filter(saved => !aliases.includes(saved));
        } else {
            bookmarks = [...bookmarks, aliases[0]];
        }

        localStorage.setItem('user_bookmarks', JSON.stringify(bookmarks));
        sortAndRenderRanking();
        executeSearch();
    }

    function isSameUser(record, user, userKey) {
        if (!record) return false;
        if (userKey && record.user_key) return String(record.user_key) === userKey;
        return String(record.id || record.display_id || '') === String(user.id || '');
    }

    function findUserInHour(hourData, user, userKey) {
        if (!Array.isArray(hourData)) return null;
        return hourData.find(record => isSameUser(record, user, userKey)) || null;
    }

    function getLastValidHour() {
        for (let i = 23; i >= 0; i--) {
            if (hourlyRawData[i] !== null && hourlyRawData[i] !== undefined) return i;
        }
        return -1;
    }

    async function getParquetModules() {
        if (!parquetModulePromise) {
            parquetModulePromise = Promise.all([
                import(HY_PARQUET_URL),
                import(HY_PARQUET_COMPRESSORS_URL)
            ]).then(([hyparquet, compressorModule]) => ({
                parquetReadObjects: hyparquet.parquetReadObjects,
                compressors: compressorModule.compressors
            }));
        }
        return parquetModulePromise;
    }

    async function loadParquetRows(url, columns) {
        const cacheKey = `${url}::${columns.join(',')}`;
        if (parquetCache.has(cacheKey)) return parquetCache.get(cacheKey);

        const request = (async () => {
            const response = await fetch(url, { cache: 'default' });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`Parquet 요청 실패 (${response.status})`);

            const arrayBuffer = await response.arrayBuffer();
            if (!arrayBuffer || arrayBuffer.byteLength === 0) return [];

            const { parquetReadObjects, compressors } = await getParquetModules();
            return parquetReadObjects({
                file: arrayBuffer,
                compressors,
                columns
            });
        })();

        parquetCache.set(cacheKey, request);
        try {
            return await request;
        } catch (error) {
            // 일시적인 네트워크/파싱 오류 또는 구버전 컬럼 불일치는 다른 스키마로 다시 시도할 수 있게 제거합니다.
            parquetCache.delete(cacheKey);
            throw error;
        }
    }

    function detailParquetCandidates(dateStr, hour, fileName) {
        const hh = String(hour).padStart(2, '0');
        return [
            // main.go v4 현재 구조: 날짜/HHh/posts.parquet, comments.parquet
            `${R2_DOMAIN}/${dateStr}/${hh}h/${fileName}`,
            // 바로 이전 상세 데이터 구조와의 호환
            `${R2_DOMAIN}/content/gallery=${encodeURIComponent(GALLERY_ID)}/date=${dateStr}/hour=${hh}/${fileName}`
        ];
    }

    async function loadParquetFromCandidates(candidates, preferredColumns, legacyColumns = preferredColumns) {
        let lastError = null;

        for (const url of candidates) {
            try {
                const rows = await loadParquetRows(url, preferredColumns);
                if (rows !== null) return rows;
                continue;
            } catch (error) {
                lastError = error;
            }

            // 구버전 Parquet에 새 컬럼이 없으면 기존 핵심 컬럼만 다시 읽습니다.
            if (legacyColumns.join(',') !== preferredColumns.join(',')) {
                try {
                    const rows = await loadParquetRows(url, legacyColumns);
                    if (rows !== null) return rows;
                } catch (error) {
                    lastError = error;
                }
            }
        }

        if (lastError) throw lastError;
        return null;
    }

    function normalizeUnixMillis(value, fallbackDate) {
        try {
            if (typeof value === 'bigint') return Number(value);
            const n = Number(value);
            if (Number.isFinite(n) && n > 0) return n;
        } catch (_) {}

        const parsed = Date.parse(fallbackDate || '');
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function sortNewestFirst(rows) {
        return rows.sort((a, b) => {
            const aTime = normalizeUnixMillis(a.created_at_unix_ms, a.created_at);
            const bTime = normalizeUnixMillis(b.created_at_unix_ms, b.created_at);
            return bTime - aTime;
        });
    }

    function cleanText(value) {
        return value === null || value === undefined ? '' : String(value).trim();
    }

    function formatCreatedAt(value) {
        const text = cleanText(value);
        if (!text) return '작성 시간 없음';
        const parsed = Date.parse(text);
        if (Number.isFinite(parsed)) {
            try {
                return new Intl.DateTimeFormat('ko-KR', {
                    timeZone: 'Asia/Seoul',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                }).format(new Date(parsed));
            } catch (_) {}
        }
        return text.replace('T', ' ').replace(/Z$/, '');
    }

    function setActivityState(containerId, message, isError = false) {
        const container = document.getElementById(containerId);
        container.replaceChildren();
        const state = document.createElement('div');
        state.className = `activity-state${isError ? ' error' : ''}`;
        state.textContent = message;
        container.appendChild(state);
    }

    function isSafeHttpUrl(value) {
        const text = cleanText(value);
        if (!text) return false;
        try {
            const parsed = new URL(text, window.location.href);
            return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (_) {
            return false;
        }
    }

    function getUrlExtension(url) {
        try {
            const pathname = new URL(cleanText(url), window.location.href).pathname.toLowerCase();
            const match = pathname.match(/\.([a-z0-9]+)$/i);
            return match ? match[1] : '';
        } catch (_) {
            return '';
        }
    }

    function isAnimatedImageUrl(url) {
        // GIF/WebP/APNG는 오디오가 없는 움직이는 이미지 계열로 표시합니다.
        return ['gif', 'webp', 'apng'].includes(getUrlExtension(url));
    }

    function inferMediaViewerKind(url, suggestedKind = 'image') {
        const ext = getUrlExtension(url);
        if (['gif', 'webp', 'apng', 'jpg', 'jpeg', 'png', 'bmp', 'avif', 'svg'].includes(ext)) return 'image';
        if (['mp4', 'webm', 'm4v', 'mov', 'ogv', 'ogg'].includes(ext)) return 'video';
        return suggestedKind === 'video' ? 'video' : 'image';
    }

    function mediaDisplayLabel(url, defaultLabel, sourceKind = 'image', storedType = '') {
        const type = cleanText(storedType);
        if (type === 'dccon') return '디시콘';
        if (type === 'animated_image') return '움짤';
        if (type === 'video') return '동영상';
        if (type === 'image') return '이미지';

        // 구버전 Parquet에는 data-media-type/새 컬럼이 없으므로 URL 확장자로 보완합니다.
        if (defaultLabel === '디시콘') return '디시콘';
        if (isAnimatedImageUrl(url)) return '움짤';
        return sourceKind === 'video' ? '동영상' : defaultLabel;
    }

    function mediaRelayUrl(originalUrl, referer = '') {
        const relayBase = cleanText(MEDIA_RELAY_URL);
        const safeOriginal = cleanText(originalUrl);
        if (!relayBase || !isSafeHttpUrl(relayBase) || !isSafeHttpUrl(safeOriginal)) return safeOriginal;
        try {
            const relay = new URL(relayBase, window.location.href);
            relay.searchParams.set('url', safeOriginal);
            if (isSafeHttpUrl(referer)) relay.searchParams.set('referer', cleanText(referer));
            return relay.toString();
        } catch (_) {
            return safeOriginal;
        }
    }

    function openMediaViewer(url, kind, title, referer = '') {
        const safeUrl = cleanText(url);
        if (!isSafeHttpUrl(safeUrl)) return false;

        const viewer = window.open('', '_blank');
        if (!viewer) return false;

        try { viewer.opener = null; } catch (_) {}
        const doc = viewer.document;
        doc.title = cleanText(title) || '미디어 보기';
        doc.documentElement.style.background = '#111';
        doc.documentElement.style.colorScheme = 'dark';
        doc.body.style.margin = '0';
        doc.body.style.minHeight = '100vh';
        doc.body.style.display = 'flex';
        doc.body.style.alignItems = 'center';
        doc.body.style.justifyContent = 'center';
        doc.body.style.background = '#111';
        doc.body.style.color = '#eee';
        doc.body.style.fontFamily = 'system-ui, sans-serif';

        const wrap = doc.createElement('div');
        wrap.style.width = '100%';
        wrap.style.minHeight = '100vh';
        wrap.style.boxSizing = 'border-box';
        wrap.style.padding = '16px';
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.alignItems = 'center';
        wrap.style.justifyContent = 'center';
        wrap.style.gap = '12px';

        // GIF/WebP/APNG처럼 '움짤'로 분류된 항목은 원본 HTML이 video 태그였더라도
        // 반드시 <img>로 표시합니다. 브라우저가 이미지 자체의 애니메이션을 재생합니다.
        const mediaKind = cleanText(title) === '움짤'
            ? 'image'
            : inferMediaViewerKind(safeUrl, kind);
        let media;
        if (mediaKind === 'video') {
            media = doc.createElement('video');
            media.controls = true;
            media.autoplay = true;
            media.playsInline = true;
            media.preload = 'metadata';
        } else {
            media = doc.createElement('img');
            media.alt = cleanText(title) || '미디어';
        }
        const displayUrl = mediaRelayUrl(safeUrl, referer);
        media.src = displayUrl;
        media.style.display = 'block';
        media.style.maxWidth = '100%';
        media.style.maxHeight = 'calc(100vh - 72px)';
        media.style.objectFit = 'contain';

        const status = doc.createElement('div');
        status.style.fontSize = '13px';
        status.style.color = '#bbb';
        status.textContent = '';
        media.addEventListener('error', () => {
            status.textContent = '브라우저에서 바로 표시하지 못했습니다. 원본 서버의 외부 표시 차단(Referer/핫링크), 응답 형식(MIME), 또는 미디어 전송 정책 때문에 실패했을 수 있습니다.';
        });

        const directLink = doc.createElement('a');
        directLink.href = safeUrl;
        directLink.target = '_blank';
        directLink.rel = 'noopener noreferrer';
        directLink.textContent = '원본 URL 직접 열기 ↗';
        directLink.style.color = '#9ecbff';
        directLink.style.fontSize = '13px';
        directLink.style.textDecoration = 'none';

        wrap.appendChild(media);
        wrap.appendChild(status);
        wrap.appendChild(directLink);
        doc.body.appendChild(wrap);
        return true;
    }

    function createActivityLink(url, label, className = 'activity-item-link', viewerKind = '', referer = '') {
        const safeUrl = cleanText(url);
        if (!isSafeHttpUrl(safeUrl)) return null;
        const link = document.createElement('a');
        link.className = className;
        link.href = safeUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = label;
        if (viewerKind) {
            link.addEventListener('click', event => {
                if (openMediaViewer(safeUrl, viewerKind, label, referer)) {
                    event.preventDefault();
                }
            });
        }
        return link;
    }

    function preferredPostOpenUrl(originalUrl, postNo) {
        const no = cleanText(postNo);
        const preferMobile = window.matchMedia &&
            window.matchMedia('(max-width: 900px), (pointer: coarse)').matches;

        if (preferMobile && no) {
            return `https://m.dcinside.com/board/${encodeURIComponent(GALLERY_ID)}/${encodeURIComponent(no)}`;
        }
        return cleanText(originalUrl);
    }

    function normalizeUrlArray(value) {
        if (Array.isArray(value)) {
            return value.map(cleanText).filter(isSafeHttpUrl);
        }
        if (value && typeof value !== 'string' && typeof value[Symbol.iterator] === 'function') {
            try {
                return Array.from(value).map(cleanText).filter(isSafeHttpUrl);
            } catch (_) {}
        }
        const text = cleanText(value);
        if (!text) return [];
        if (text.startsWith('[')) {
            try {
                const parsed = JSON.parse(text);
                if (Array.isArray(parsed)) return parsed.map(cleanText).filter(isSafeHttpUrl);
            } catch (_) {}
        }
        return isSafeHttpUrl(text) ? [text] : [];
    }

    function appendBreakIfNeeded(container) {
        const last = container.lastChild;
        if (!last || last.nodeName !== 'BR') container.appendChild(document.createElement('br'));
    }

    function storedMediaType(node, fallbackTag = '') {
        const marked = cleanText(node && node.getAttribute ? node.getAttribute('data-media-type') : '');
        if (['image', 'animated_image', 'video', 'dccon'].includes(marked)) return marked;
        return fallbackTag;
    }

    function appendStoredHtmlNode(node, container, seenUrls, allowVideo, imageLabel = '이미지', referer = '') {
        if (node.nodeType === Node.TEXT_NODE) {
            container.appendChild(document.createTextNode(node.nodeValue || ''));
            return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;

        const tag = node.tagName.toLowerCase();

        if (tag === 'br') {
            container.appendChild(document.createElement('br'));
            return;
        }

        if (tag === 'img') {
            const url = cleanText(node.getAttribute('src') || node.getAttribute('data-src') || node.getAttribute('data-original'));
            if (isSafeHttpUrl(url)) {
                const type = storedMediaType(node, isAnimatedImageUrl(url) ? 'animated_image' : 'image');
                const label = mediaDisplayLabel(url, imageLabel, 'image', type);
                const viewerKind = type === 'video' ? 'video' : 'image';
                const link = createActivityLink(url, label, 'activity-inline-link', viewerKind, referer);
                if (link) {
                    container.appendChild(link);
                    seenUrls.add(url);
                }
            }
            return;
        }

        if (tag === 'video') {
            let url = cleanText(node.getAttribute('src'));
            let sourceNode = null;
            if (!url) {
                sourceNode = node.querySelector('source[src]');
                if (sourceNode) url = cleanText(sourceNode.getAttribute('src'));
            }
            if (isSafeHttpUrl(url)) {
                const markedNode = sourceNode || node;
                let fallbackType = isAnimatedImageUrl(url) ? 'animated_image' : 'video';
                if (!allowVideo && imageLabel === '디시콘') fallbackType = 'dccon'; // 구버전 댓글 호환
                const type = storedMediaType(markedNode, storedMediaType(node, fallbackType));
                const label = mediaDisplayLabel(url, imageLabel, 'video', type);
                const viewerKind = type === 'video' ? 'video' : 'image';
                const link = createActivityLink(url, label, 'activity-inline-link', viewerKind, referer);
                if (link) {
                    container.appendChild(link);
                    seenUrls.add(url);
                }
            }
            return;
        }

        if (tag === 'source') return;

        if (tag === 'a') {
            if (node.querySelector('img, video, source')) {
                for (const child of node.childNodes) {
                    appendStoredHtmlNode(child, container, seenUrls, allowVideo, imageLabel, referer);
                }
                return;
            }

            const url = cleanText(node.getAttribute('href'));
            const label = cleanText(node.textContent) || '링크';
            if (isSafeHttpUrl(url)) {
                const link = createActivityLink(url, label, 'activity-inline-link');
                if (link) {
                    container.appendChild(link);
                    seenUrls.add(url);
                    return;
                }
            }
        }

        const blockTags = new Set(['div', 'p', 'li', 'section', 'article', 'blockquote', 'pre']);
        for (const child of node.childNodes) {
            appendStoredHtmlNode(child, container, seenUrls, allowVideo, imageLabel, referer);
        }
        if (blockTags.has(tag)) appendBreakIfNeeded(container);
    }

    function hasVisibleContent(container) {
        if (cleanText(container.textContent)) return true;
        return Boolean(container.querySelector('a'));
    }

    function renderStoredContent(row, body, allowVideo, imageLabel = '이미지') {
        const seenUrls = new Set();
        const storedHtml = cleanText(row.content_html);
        const referer = cleanText(row.url || row.post_url);

        if (storedHtml) {
            try {
                const parsed = new DOMParser().parseFromString(`<div id="stored-content-root">${storedHtml}</div>`, 'text/html');
                const root = parsed.getElementById('stored-content-root');
                if (root) {
                    for (const child of root.childNodes) {
                        appendStoredHtmlNode(child, body, seenUrls, allowVideo, imageLabel, referer);
                    }
                }
            } catch (error) {
                console.warn('저장 본문 HTML 변환 실패:', error);
            }
        }

        if (!hasVisibleContent(body)) {
            const plain = cleanText(row.content);
            if (plain) body.textContent = plain;
        }

        const imageUrls = normalizeUrlArray(row.image_urls);
        const animatedImageUrls = normalizeUrlArray(row.animated_image_urls);
        const videoUrls = normalizeUrlArray(row.video_urls);
        const dcconUrls = normalizeUrlArray(row.dccon_urls);
        const linkUrls = normalizeUrlArray(row.link_urls);
        const extras = [];

        const addExtra = (url, label, viewerKind) => {
            if (!seenUrls.has(url)) {
                extras.push({ url, label, viewerKind, referer });
                seenUrls.add(url);
            }
        };

        imageUrls.forEach(url => addExtra(url, mediaDisplayLabel(url, imageLabel, 'image', 'image'), 'image'));
        animatedImageUrls.forEach(url => addExtra(url, '움짤', 'image'));
        if (allowVideo || videoUrls.length > 0) {
            videoUrls.forEach(url => addExtra(url, '동영상', 'video'));
        }
        dcconUrls.forEach(url => addExtra(url, '디시콘', 'image'));
        linkUrls.forEach(url => {
            if (!seenUrls.has(url)) {
                extras.push({ url, label: '외부 링크', viewerKind: '', referer: '' });
                seenUrls.add(url);
            }
        });

        if (!hasVisibleContent(body) && extras.length === 0) {
            body.textContent = '내용이 없습니다.';
            body.classList.add('empty');
            return null;
        }

        if (!extras.length) return null;

        const extraBox = document.createElement('div');
        extraBox.className = 'activity-media-links';
        extras.forEach(extra => {
            const link = createActivityLink(extra.url, extra.label, 'activity-item-link', extra.viewerKind || '', extra.referer || '');
            if (link) extraBox.appendChild(link);
        });
        return extraBox.childElementCount ? extraBox : null;
    }

    function contentTypeLabel(value, imageLabel = '이미지') {
        const labels = {
            text: '텍스트',
            image: imageLabel,
            animated_image: '움짤',
            video: '동영상',
            dccon: '디시콘',
            link: '링크',
            mixed: '혼합',
            empty: '빈 내용'
        };
        return labels[cleanText(value)] || '';
    }

    function contentTypeLabelForRow(row, imageLabel = '이미지', allowVideo = true) {
        const type = cleanText(row && row.content_type);
        if (['animated_image', 'dccon'].includes(type)) return contentTypeLabel(type, imageLabel);

        // 구버전 파일은 animated_image_urls/dccon_urls가 없으므로 기존 방식으로 추정합니다.
        if (type === 'image') {
            const urls = normalizeUrlArray(row && row.image_urls);
            if (urls.length > 0 && urls.every(isAnimatedImageUrl)) return '움짤';
            return imageLabel;
        }
        if (type === 'video' && allowVideo) {
            const urls = normalizeUrlArray(row && row.video_urls);
            if (urls.length > 0 && urls.every(isAnimatedImageUrl)) return '움짤';
            return '동영상';
        }
        return contentTypeLabel(type, imageLabel);
    }

    function addMetaBadge(meta, label) {
        if (!label) return;
        const badge = document.createElement('span');
        badge.className = 'activity-type-badge';
        badge.textContent = label;
        meta.appendChild(badge);
    }

    function attachPostContentToggle(body) {
        body.classList.add('post-collapsible', 'collapsed');

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'activity-content-toggle';
        toggle.textContent = '더보기';
        toggle.hidden = true;
        body.insertAdjacentElement('afterend', toggle);

        const updateVisibility = () => {
            if (!body.isConnected) return;
            const overflowing = body.scrollHeight > body.clientHeight + 2;
            toggle.hidden = !overflowing;
            if (!overflowing) body.classList.remove('collapsed');
        };

        requestAnimationFrame(updateVisibility);

        toggle.addEventListener('click', () => {
            const isCollapsed = body.classList.toggle('collapsed');
            toggle.textContent = isCollapsed ? '더보기' : '접기';
            if (isCollapsed) {
                body.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });
    }

    function renderPostItems(posts) {
        const container = document.getElementById('recent-posts');
        container.replaceChildren();

        if (!posts.length) {
            setActivityState('recent-posts', '최근 게시글 내용 데이터가 없습니다.');
            return;
        }

        posts.slice(0, 5).forEach(post => {
            const item = document.createElement('article');
            item.className = 'activity-item';

            const title = document.createElement('div');
            title.className = 'activity-item-title';
            title.textContent = cleanText(post.title) || '제목이 없습니다.';
            item.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'activity-item-meta';
            const postNo = cleanText(post.post_no);
            const commentCount = Number(post.comment_count);
            const parts = [
                formatCreatedAt(post.created_at),
                postNo ? `글 ${postNo}` : '',
                Number.isFinite(commentCount) && commentCount >= 0 ? `댓글 ${commentCount}` : ''
            ].filter(Boolean);
            const metaText = document.createElement('span');
            metaText.textContent = parts.join(' · ');
            meta.appendChild(metaText);
            addMetaBadge(meta, contentTypeLabelForRow(post, '이미지', true));
            item.appendChild(meta);

            const body = document.createElement('div');
            body.className = 'activity-item-content';
            const extras = renderStoredContent(post, body, true, '이미지');
            item.appendChild(body);
            attachPostContentToggle(body);
            if (extras) item.appendChild(extras);

            const link = createActivityLink(preferredPostOpenUrl(post.url, post.post_no), '게시글 열기 ↗');
            if (link) item.appendChild(link);
            container.appendChild(item);
        });
    }

    function renderCommentItems(comments) {
        const container = document.getElementById('recent-comments');
        container.replaceChildren();

        if (!comments.length) {
            setActivityState('recent-comments', '최근 댓글 내용 데이터가 없습니다.');
            return;
        }

        comments.slice(0, 10).forEach(comment => {
            const item = document.createElement('article');
            item.className = 'activity-item';

            const meta = document.createElement('div');
            meta.className = 'activity-item-meta';
            const postNo = cleanText(comment.post_no);
            const commentNo = cleanText(comment.comment_no);
            const ids = [postNo ? `글 ${postNo}` : '', commentNo ? `댓글 ${commentNo}` : ''].filter(Boolean);
            const metaText = document.createElement('span');
            metaText.textContent = [formatCreatedAt(comment.created_at), ...ids].join(' · ');
            meta.appendChild(metaText);

            const relation = cleanText(comment.relation_type);
            if (relation === 'reply_to_comment' || Number(comment.depth) > 0) {
                addMetaBadge(meta, '답글');
            } else if (relation === 'comment_on_post') {
                addMetaBadge(meta, '댓글');
            }
            const isLegacyCommentMedia = !Object.prototype.hasOwnProperty.call(comment, 'dccon_urls');
            const commentImageLabel = isLegacyCommentMedia ? '디시콘' : '이미지';
            addMetaBadge(meta, contentTypeLabelForRow(comment, commentImageLabel, true));
            item.appendChild(meta);

            const body = document.createElement('div');
            body.className = 'activity-item-content';
            const extras = renderStoredContent(comment, body, true, commentImageLabel);
            item.appendChild(body);
            if (extras) item.appendChild(extras);

            const link = createActivityLink(preferredPostOpenUrl(comment.post_url, comment.post_no), '원문 게시글 열기 ↗');
            if (link) item.appendChild(link);
            container.appendChild(item);
        });
    }

    const POST_COLUMNS_CURRENT = [
        'user_key', 'post_no', 'url', 'title', 'content', 'content_html',
        'image_urls', 'animated_image_urls', 'video_urls', 'link_urls', 'content_type',
        'created_at', 'created_at_unix_ms', 'comment_count'
    ];
    const POST_COLUMNS_LEGACY = [
        'user_key', 'post_no', 'url', 'title', 'content', 'created_at', 'created_at_unix_ms'
    ];
    const COMMENT_COLUMNS_CURRENT = [
        'user_key', 'comment_no', 'post_no', 'post_url', 'parent_comment_no', 'depth',
        'relation_type', 'content', 'content_html', 'image_urls', 'animated_image_urls', 'video_urls', 'dccon_urls', 'link_urls', 'content_type',
        'created_at', 'created_at_unix_ms'
    ];
    const COMMENT_COLUMNS_LEGACY = [
        'user_key', 'comment_no', 'post_no', 'post_url', 'content', 'created_at', 'created_at_unix_ms'
    ];

    async function loadRecentUserActivity(user, requestSequence) {
        const dateStr = document.getElementById('date-picker').value || todayKst;
        const userKey = resolveUserKey(user);
        const lastValidHour = getLastValidHour();
        const posts = [];
        const comments = [];

        if (!userKey) {
            setActivityState('recent-posts', '이 데이터에는 user_key가 없어 게시글 내용을 연결할 수 없습니다.');
            setActivityState('recent-comments', '이 데이터에는 user_key가 없어 댓글 내용을 연결할 수 없습니다.');
            return;
        }

        if (lastValidHour < 0) {
            setActivityState('recent-posts', '최근 게시글 내용 데이터가 없습니다.');
            setActivityState('recent-comments', '최근 댓글 내용 데이터가 없습니다.');
            return;
        }

        // 최신 시간부터 역순으로 확인합니다. 집계에서 이 사용자가 실제 활동한 시간의
        // Parquet만 읽고, 게시글 5개/댓글 10개가 모이면 더 오래된 파일은 읽지 않습니다.
        for (let hour = lastValidHour; hour >= 0; hour--) {
            if (requestSequence !== modalLoadSequence) return;
            if (posts.length >= 5 && comments.length >= 10) break;

            const hourUser = findUserInHour(hourlyRawData[hour], user, userKey);
            if (!hourUser) continue;

            const needPosts = posts.length < 5 && Number(hourUser.post || 0) > 0;
            const needComments = comments.length < 10 && Number(hourUser.comment || 0) > 0;
            if (!needPosts && !needComments) continue;

            const postPromise = needPosts
                ? loadParquetFromCandidates(
                    detailParquetCandidates(dateStr, hour, 'posts.parquet'),
                    POST_COLUMNS_CURRENT,
                    POST_COLUMNS_LEGACY
                )
                : Promise.resolve(null);

            const commentPromise = needComments
                ? loadParquetFromCandidates(
                    detailParquetCandidates(dateStr, hour, 'comments.parquet'),
                    COMMENT_COLUMNS_CURRENT,
                    COMMENT_COLUMNS_LEGACY
                )
                : Promise.resolve(null);

            const [postRows, commentRows] = await Promise.all([postPromise, commentPromise]);
            if (requestSequence !== modalLoadSequence) return;

            if (Array.isArray(postRows)) {
                posts.push(...postRows.filter(row => String(row.user_key || '') === userKey));
                sortNewestFirst(posts);
                if (posts.length > 5) posts.length = 5;
            }

            if (Array.isArray(commentRows)) {
                comments.push(...commentRows.filter(row => String(row.user_key || '') === userKey));
                sortNewestFirst(comments);
                if (comments.length > 10) comments.length = 10;
            }
        }

        if (requestSequence !== modalLoadSequence) return;
        renderPostItems(sortNewestFirst(posts).slice(0, 5));
        renderCommentItems(sortNewestFirst(comments).slice(0, 10));
    }

    function scrollModalSection(sectionId) {
        const section = document.getElementById(sectionId);
        if (!section) return;
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function openModal(user) {
        const requestSequence = ++modalLoadSequence;
        const nick = cleanText(user.nickname) || '이름 없음';
        const id = formatUserIdentity(user);
        const userKey = resolveUserKey(user);
        const modal = document.getElementById('graph-modal');
        const modalContent = modal.querySelector('.modal-content');

        modal.style.display = 'block';
        document.body.classList.add('modal-open');
        if (modalContent) modalContent.scrollTop = 0;

        document.getElementById('modal-title').innerText = id
            ? `${nick} (${id}) 상세 그래프`
            : `${nick} 상세 그래프`;
        setActivityState('recent-posts', '최근 게시글을 불러오는 중...');
        setActivityState('recent-comments', '최근 댓글을 불러오는 중...');

        const lastValidIndex = getLastValidHour();
        const validLen = lastValidIndex >= 0 ? lastValidIndex + 1 : 0;
        const hours = Array.from({length: validLen}, (_, i) => `${i}시`);
        const userPosts = [];
        const userComments = [];

        for (let i = 0; i < validLen; i++) {
            const userRecord = findUserInHour(hourlyRawData[i], user, userKey);
            userPosts.push(userRecord ? Number(userRecord.post || 0) : 0);
            userComments.push(userRecord ? Number(userRecord.comment || 0) : 0);
        }

        if (modalChart) modalChart.dispose();
        modalChart = echarts.init(document.getElementById('chart-container'));
        modalChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['게시글', '댓글'], top: '0%' },
            grid: { left: '3%', right: '4%', bottom: '5%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: hours },
            yAxis: { type: 'value', minInterval: 1 },
            series: [
                { name: '게시글', type: 'line', smooth: true, data: userPosts, itemStyle: { color: '#007bff' }, areaStyle: { opacity: 0.1 } },
                { name: '댓글', type: 'line', smooth: true, data: userComments, itemStyle: { color: '#ff4b4b' }, areaStyle: { opacity: 0.1 } }
            ]
        });
        requestAnimationFrame(() => {
            if (modalChart) modalChart.resize();
        });

        loadRecentUserActivity(user, requestSequence).catch(error => {
            if (requestSequence !== modalLoadSequence) return;
            console.error('상세 Parquet 로딩 실패:', error);
            setActivityState('recent-posts', '게시글 상세 데이터를 불러오지 못했습니다.', true);
            setActivityState('recent-comments', '댓글 상세 데이터를 불러오지 못했습니다.', true);
        });
    }

    function closeModal() {
        modalLoadSequence++;
        const modal = document.getElementById('graph-modal');
        modal.style.display = "none";
        document.body.classList.remove('modal-open');
    }

    document.getElementById('graph-modal').addEventListener('click', event => {
        if (event.target === event.currentTarget) closeModal();
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.getElementById('graph-modal').style.display === 'block') {
            closeModal();
        }
    });

    window.addEventListener('resize', () => {
        if (modalChart) modalChart.resize();
    });

    window.onload = () => fetchDailyData(todayKst);
</script>
